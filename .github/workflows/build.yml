name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pdf:
    name: build PDFs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        doc:
          - rnr_coding
          - rnr_summary
          - rnr_engineering_spec
          - rnr_experimental_design
    steps:
      - uses: actions/checkout@v4

      - name: compile ${{ matrix.doc }}.tex with lualatex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ matrix.doc }}.tex
          working_directory: tex
          latexmk_use_lualatex: true
          latexmk_shell_escape: false
          args: -interaction=nonstopmode -halt-on-error -file-line-error

      - name: upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.doc }}-pdf
          path: tex/${{ matrix.doc }}.pdf
          if-no-files-found: error

  docx:
    name: build DOCX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: convert .tex to .docx
        run: |
          mkdir -p build/docx
          for f in tex/*.tex; do
            name=$(basename "$f" .tex)
            pandoc "$f" -o "build/docx/${name}.docx"
          done

      - name: upload DOCX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docx-bundle
          path: build/docx/*.docx
          if-no-files-found: error

  verify:
    name: verify (executable proofs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install numeric deps
        run: pip install numpy sympy mpmath

      - name: run section 7.34 RD-dispersion verification probes
        run: |
          set -e
          probes="
            probe_7_34j_ternary_gray
            probe_7_34k_aary_gray
            probe_7_34o_beyond_gray
            probe_7_34m_convexity_endpoint
            probe_7_34n_aary_asym
            probe_7_34p_lossy_devhier
            probe_7_34q_lee_general_distortion
            probe_7_34m_endpoint_pi
          "
          for p in $probes; do
            echo "::group::$p"
            out=$(python scripts/verify/$p.py)
            echo "$out" | tail -4
            echo "$out" | grep -q "OVERALL -> PASS" || { echo "::error::$p did not report OVERALL -> PASS"; exit 1; }
            echo "::endgroup::"
          done
          echo "all section 7.34 verification probes reported OVERALL -> PASS"

      - name: run section 6.6 Type-III-C builder-universality probe
        run: |
          set -e
          p=lemma_6_6d_mdl_entropy_fallback_universal
          echo "::group::$p"
          out=$(python scripts/verify/$p.py)
          echo "$out" | tail -6
          echo "$out" | grep -q "OVERALL -> PASS" || { echo "::error::$p did not report OVERALL -> PASS"; exit 1; }
          echo "::endgroup::"
          echo "section 6.6 builder-universality probe reported OVERALL -> PASS"

      - name: run model-inclusive accounting probe (BUG-002)
        run: |
          set -e
          p=bug_002_model_inclusive_accounting
          echo "::group::$p"
          out=$(python scripts/verify/$p.py)
          echo "$out" | tail -8
          echo "$out" | grep -q "OVERALL -> PASS" || { echo "::error::$p did not report OVERALL -> PASS"; exit 1; }
          echo "::endgroup::"
          echo "model-inclusive accounting probe reported OVERALL -> PASS"

      - name: run Theorem 10.1 integer reduction-order bit-exactness probe (BUG-007)
        run: |
          set -e
          p=thm_10_1_integer_reorder_bitexact
          echo "::group::$p"
          out=$(python scripts/verify/$p.py)
          echo "$out" | tail -8
          echo "$out" | grep -q "OVERALL -> PASS" || { echo "::error::$p did not report OVERALL -> PASS"; exit 1; }
          echo "::endgroup::"
          echo "Theorem 10.1 integer reorder bit-exactness probe reported OVERALL -> PASS"

      - name: run conditional-ratio-claim + mapping invariant probe (BUG-001)
        run: |
          set -e
          p=bug_001_ratio_claim_conditional
          echo "::group::$p"
          out=$(python scripts/verify/$p.py)
          echo "$out" | tail -10
          echo "$out" | grep -q "OVERALL -> PASS" || { echo "::error::$p did not report OVERALL -> PASS"; exit 1; }
          echo "::endgroup::"
          echo "conditional-ratio-claim + mapping invariant probe reported OVERALL -> PASS"

      - name: run random-access cost-accounting probe (BUG-008)
        run: |
          set -e
          p=bug_008_random_access_cost
          echo "::group::$p"
          out=$(python scripts/verify/$p.py)
          echo "$out" | tail -8
          echo "$out" | grep -q "OVERALL -> PASS" || { echo "::error::$p did not report OVERALL -> PASS"; exit 1; }
          echo "::endgroup::"
          echo "random-access cost-accounting probe reported OVERALL -> PASS"
